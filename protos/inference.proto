syntax = "proto3";

package ai_inference;


message SentimentRequest { string text = 1; }
message SentimentResponse { string response = 1; }
message PromptRequest { string prompt = 1; }
message TokenResponse { string token = 1; }

message FileInfo {
  string file_name = 1;
  string file_type = 2;
}

message UploadFileRequest {
  oneof data {
    FileInfo info = 1;
    bytes chunk_data = 2;
  }
}

message UploadFileResponse {
    string summary = 1;
}

message ChatMessage { string role = 2; string content = 3; }


service AIInference {
    // Unary (Sentiment)
    rpc AnalyzeSentiment (SentimentRequest) returns (SentimentResponse);

    // Server streaming (Chat generation)
    rpc StreamChat (PromptRequest) returns (stream TokenResponse);

    // Client streaming (Summarization)
    rpc SummarizeDocument (stream UploadFileRequest) returns (UploadFileResponse);

    // Bidirectional (Live assistant)
    rpc LiveAssistant (stream ChatMessage) returns (stream ChatMessage);
}
